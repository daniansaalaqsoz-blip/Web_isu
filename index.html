<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <!-- MENCEGAH ZOOM IN & ZOOM OUT DI HP -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- PAKSA SEMUA RESOURCE KE HTTPS BIAR GAK MIXED CONTENT / ERROR SSL -->
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
    <title>𓍯𝜗𝜚˚kᥡórii𐚁</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        
        body { 
            min-height: 100vh; 
            background: #0a0a0c; 
            color: #e2e8f0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            padding: 20px; 
            overflow-x: hidden; 
            position: relative; 
            touch-action: manipulation;
        }

        .ambient-bg { position: fixed; width: 300px; height: 300px; background: radial-gradient(circle, rgba(99, 102, 241, 0.15) 0%, rgba(0,0,0,0) 70%); top: 20%; left: 50%; transform: translate(-50%, -50%); z-index: 0; pointer-events: none; }
        
        .card { position: relative; z-index: 1; width: 100%; max-width: 420px; background: rgba(18, 18, 24, 0.85); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 24px; text-align: center; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5); animation: fadeIn 1.2s ease-out; overflow: hidden; padding-bottom: 25px; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        
        /* BANNER VIDEO STYLING */
        .banner-container { 
            width: 100%; 
            height: 170px; 
            position: relative; 
            overflow: hidden;
            background: #121218;
        }
        .banner-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
        }

        .profile-header { position: relative; padding: 0 20px; text-align: left; margin-bottom: 15px; }
        .avatar-container { position: relative; width: 85px; height: 85px; margin-top: -65px; margin-bottom: -15px; }
        
        /* FOTO PROFIL */
        .avatar { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 4px solid #121218; box-shadow: 0 8px 25px rgba(0,0,0,0.4); }
        
        .name-wrapper { margin-top: 5px; }
        h1 { font-size: 1.5rem; font-weight: 700; color: #ffffff; letter-spacing: -0.5px; }
        .username { font-size: 0.85rem; color: #818cf8; margin-top: 4px; font-weight: 600; letter-spacing: 0.5px; }

        .card-body { padding: 0 20px; }
        .music-player { background: rgba(255, 255, 255, 0.04); border-radius: 16px; padding: 14px 18px; display: flex; align-items: center; gap: 14px; border: 1px solid rgba(255, 255, 255, 0.06); margin-bottom: 20px; }
        .music-icon { width: 42px; height: 42px; background: rgba(99, 102, 241, 0.2); border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #818cf8; font-size: 1.1rem; }
        .music-info { text-align: left; flex-grow: 1; overflow: hidden; }
        .song-title { font-size: 0.88rem; font-weight: 600; color: #f1f5f9; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .artist { font-size: 0.75rem; color: #94a3b8; }
        .play-btn { background: #6366f1; border: none; width: 36px; height: 36px; border-radius: 50%; color: white; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s ease; }
        .play-btn:hover { transform: scale(1.08); background: #4f46e5; }
        
        .links-container { display: flex; flex-direction: column; gap: 10px; }
        .link-btn { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 12px; background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.06); border-radius: 12px; color: #e2e8f0; text-decoration: none; font-size: 0.85rem; font-weight: 500; transition: all 0.25s ease; cursor: pointer; }
        .link-btn:hover { background: rgba(255, 255, 255, 0.08); border-color: rgba(255, 255, 255, 0.15); transform: translateY(-2px); }
        .link-btn.wa { border-color: rgba(34, 197, 94, 0.2); }
        .link-btn.wa:hover { background: rgba(34, 197, 94, 0.1); border-color: #22c55e; }
        .link-btn.qris { border-color: rgba(234, 179, 8, 0.2); }
        .link-btn.qris:hover { background: rgba(234, 179, 8, 0.1); border-color: #eab308; }

        /* POPUP QRIS COMPACT */
        .qris-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(6px); z-index: 999; justify-content: center; align-items: center; padding: 15px; }
        .qris-box { background: #ffffff; color: #111827; border-radius: 20px; padding: 20px 18px; max-width: 310px; width: 100%; text-align: center; position: relative; animation: popIn 0.25s ease-out; box-shadow: 0 15px 30px rgba(0,0,0,0.3); }
        @keyframes popIn { from { transform: scale(0.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        
        .qris-title { font-size: 0.95rem; font-weight: 700; color: #111827; line-height: 1.35; margin-top: 10px; margin-bottom: 4px; padding: 0 10px; }
        .qris-sub { font-size: 0.72rem; color: #4b5563; line-height: 1.3; margin-bottom: 12px; }
        .qris-img { width: 170px; height: 170px; object-fit: contain; margin: 0 auto; display: block; border-radius: 8px; border: 1px solid #e5e7eb; padding: 4px; }
        
        .close-btn { position: absolute; top: 10px; right: 14px; background: none; border: none; color: #6b7280; font-size: 1.1rem; cursor: pointer; }
        .close-btn:hover { color: #111827; }

        footer { margin-top: 25px; font-size: 0.7rem; color: #475569; text-align: center; }
    </style>
</head>
<body>
    <div class="ambient-bg"></div>
    <div class="card">
        <!-- BANNER VIDEO (DIPUTAR OTOMATIS DAN TANPA SUARA BIAR GAK DIBLOKIR BROWSER) -->
        <div class="banner-container">
            <video class="banner-video" autoplay loop muted playsinline>
                <source src="https://raw.githubusercontent.com/daniansaalaqsoz-blip/Scrip/main/1793120500981..mp4" type="video/mp4">
            </video>
        </div>

        <!-- FOTO PROFIL & NAMA -->
        <div class="profile-header">
            <div class="avatar-container">
                <img src="https://raw.githubusercontent.com/daniansaalaqsoz-blip/Scrip/refs/heads/main/IMG-20261013-WA0034.jpg" alt="kyórii" class="avatar">
            </div>
            <div class="name-wrapper">
                <h1>𓍯𝜗𝜚˚kᥡórii𐚁</h1>
                <div class="username">@kyomiizx • my little world 💫</div>
            </div>
        </div>

        <!-- MAIN BODY -->
        <div class="card-body">
            <div class="music-player">
                <div class="music-icon" id="musicIcon">
                    <i class="fa-solid fa-music"></i>
                </div>
                <div class="music-info">
                    <div class="song-title" id="songTitle">line without a hook</div>
                    <div class="artist">ricky montgomery</div>
                </div>
                <button class="play-btn" id="playBtn" onclick="toggleAudio()">
                    <i class="fa-solid fa-play" id="playIcon"></i>
                </button>
            </div>

            <audio id="bgAudio" loop preload="auto">
                <source src="https://raw.githubusercontent.com/daniansaalaqsoz-blip/Scrip/main/AUD-20261026-WA0010.mp3" type="audio/mpeg">
            </audio>

            <div class="links-container">
                <a href="https://tiktok.com/@kyomiizx" target="_blank" class="link-btn">
                    <i class="fa-brands fa-tiktok"></i> TikTok
                </a>
                <a href="https://discord.gg/td5HXbhTXm" target="_blank" class="link-btn">
                    <i class="fa-brands fa-discord"></i> Discord
                </a>
                <a href="https://whatsapp.com/channel/0029VbEI8T84dTnNRASGcF0w" target="_blank" class="link-btn wa">
                    <i class="fa-brands fa-whatsapp"></i> Saluran WA
                </a>

                <!-- TOMBOL MENU DONASI / QRIS -->
                <div class="link-btn qris" onclick="openQris()">
                    <i class="fa-solid fa-qrcode"></i> Donasi / QRIS
                </div>
            </div>

            <footer>
                &copy; 2026 kyórii. All rights reserved. (beta)
            </footer>
        </div>
    </div>

    <!-- MODAL POPUP QRIS -->
    <div class="qris-modal" id="qrisModal" onclick="closeQris(event)">
        <div class="qris-box">
            <button class="close-btn" onclick="toggleQris(false)"><i class="fa-solid fa-xmark"></i></button>
            
            <div class="qris-title">Scan QR Code di bawah ini pakai aplikasi bank/ewallet</div>
            <div class="qris-sub">(atau screenshot & upload ke aplikasi bank/ewallet Anda)</div>
            
            <!-- GAMBAR BARCODE QRIS -->
            <img src="https://cdn.discordapp.com/attachments/1457352525240995910/1563990851045040320/qr_ID1026586239216_26.10.26_1792954862_1792954862766.jpg?ex=6adfa37c&is=6ade51fc&hm=38882974c9559742c4cd911791c2c3757e7169f589bca1f7a61dc29a1d405c6f&" alt="QRIS Code" class="qris-img">
        </div>
    </div>

    <script>
        const audio = document.getElementById('bgAudio');
        const playBtn = document.getElementById('playBtn');
        const playIcon = document.getElementById('playIcon');
        const musicIcon = document.getElementById('musicIcon');
        const qrisModal = document.getElementById('qrisModal');

        function toggleAudio() {
            if (audio.paused) {
                audio.play().then(() => {
                    playIcon.classList.remove('fa-play');
                    playIcon.classList.add('fa-pause');
                    musicIcon.style.animation = 'spin 4s linear infinite';
                }).catch(err => {
                    console.log("Audio Play Error:", err);
                });
            } else {
                audio.pause();
                playIcon.classList.remove('fa-pause');
                playIcon.classList.add('fa-play');
                musicIcon.style.animation = 'none';
            }
        }

        // AUTO-PLAY SAAT KETUKAN/SENTUHAN PERTAMA DI MANA SAJA PADA LAYAR
        function initAudioOnTouch() {
            if (audio.paused) {
                toggleAudio();
            }
            ['touchstart', 'click', 'pointerdown'].forEach(evt => {
                document.removeEventListener(evt, initAudioOnTouch);
            });
        }

        ['touchstart', 'click', 'pointerdown'].forEach(evt => {
            document.addEventListener(evt, initAudioOnTouch, { once: true });
        });

        // SCRIPT POPUP QRIS
        function openQris() {
            qrisModal.style.display = 'flex';
        }

        function toggleToggle(show) {
            qrisModal.style.display = show ? 'flex' : 'none';
        }

        function closeQris(e) {
            if (e.target === qrisModal) {
                qrisModal.style.display = 'none';
            }
        }

        // BERSIHKAN QUERY ?i=5 DARI BARIS URL BROWSER
        if (window.location.search.includes('i=')) {
            const cleanUrl = window.location.protocol + "//" + window.location.host + window.location.pathname;
            window.history.replaceState({path: cleanUrl}, '', cleanUrl);
        }
    </script>
</body>
</html>
